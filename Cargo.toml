[workspace]
resolver = "2"
members = ["crates/wt-proto", "crates/wt-core", "crates/wt-napi"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
bytes = "1.12"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "macros", "time", "io-util"] }
quinn = { version = "0.11", default-features = false, features = ["rustls-aws-lc-rs", "runtime-tokio"] }
quinn-proto = { version = "0.11", default-features = false }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
sha2 = "0.10"
futures-util = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
